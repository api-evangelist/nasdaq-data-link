generated: '2026-07-22'
method: searched
source: https://docs.data.nasdaq.com/docs/in-depth-usage-1
docs:
  - https://docs.data.nasdaq.com/docs/in-depth-usage-1
  - https://docs.data.nasdaq.com/docs/rate-limits-1
  - https://docs.data.nasdaq.com/docs/error-codes
  - https://docs.data.nasdaq.com/docs/large-table-download
authentication:
  style: api_key query parameter (api_key=YOURAPIKEY) for the Tables REST API; OAuth client credentials for NCDS real-time/streaming
  artifact: authentication/nasdaq-data-link-authentication.yml
transport:
  https_required: true
  note: All REST API requests for tables must use HTTPS; requests over HTTP fail
url_pattern:
  datatables: "GET https://data.nasdaq.com/api/v3/datatables/{vendor_code}/{table_code}.{format}"
  metadata: "GET https://data.nasdaq.com/api/v3/datatables/{datatable_code}/metadata.{format}"
formats:
  style: file extension on the resource path
  supported: [json, xml, csv]
  default: json (when no extension is given)
filtering:
  row_filters: >-
    Filterable columns accept operator-suffixed query params: column=value,
    column.eq, column.gte, column.lte, column.in[] (lists), and comma-separated
    multi-values (e.g. ticker=SPY,IWM). Only columns designated filterable in
    the table documentation can be used.
  column_selection: qopts.columns=col1,col2 selects specific columns
pagination:
  style: cursor
  request_param: qopts.cursor_id
  response_field: next_cursor_id
  page_limit: 10000 rows per call
  note: Paginate by appending next_cursor_id to the same call until it is null
bulk_export:
  param: qopts.export=true
  behavior: >-
    Creates an asynchronous job returning a download link to a zipped CSV of
    the entire (filtered) table, bypassing the 10,000-row limit; limited to 60
    uses per hour. The separate Bulk Download REST API / bulkdownload CLI
    delivers parquet files.
idempotency:
  supported: false
  note: >-
    Read-only data API (GET); no Idempotency-Key header or idempotency
    contract is documented.
request_tracing: null
versioning:
  scheme: uri-path
  current: v3
error_envelope:
  shape: custom Nasdaq Data Link error codes (QE*) with HTTP status and message
  artifact: errors/nasdaq-data-link-error-codes.yml
rate_limit_signaling:
  status_code: 429
  artifact: rate-limits/nasdaq-data-link-rate-limits.yml
related:
  - errors/nasdaq-data-link-error-codes.yml
  - rate-limits/nasdaq-data-link-rate-limits.yml
  - lifecycle/nasdaq-data-link-lifecycle.yml
  - authentication/nasdaq-data-link-authentication.yml
