description: >-
  The Nasdaq Data Link REST API for tables returns standard HTTP status codes
  plus custom Nasdaq Data Link error codes (QE* prefix) with human-readable
  messages. All requests must be made over HTTPS; requests over HTTP fail.
  Code families: QEL (limits), QEA (authentication), QEP (permissions),
  QES (syntax/parameters), QEC (codes/routes), QEM/QEX (server errors).
status_page: https://status.data.nasdaq.com
