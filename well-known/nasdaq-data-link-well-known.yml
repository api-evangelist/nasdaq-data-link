  catch-all for every /.well-known/* path probed (security.txt,
  openid-configuration, oauth-authorization-server, api-catalog, ai-plugin.json
  all return the same JSON document with a 200). Only the protected-resource
  document itself is treated as genuine; no RFC 9116 security.txt is published
  on these hosts. The advertised authorization server is an Okta org at
  signin.nasdaq.com whose RFC 8414 metadata is saved here as well.
