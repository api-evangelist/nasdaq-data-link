apis:
  - name: Nasdaq Data Link Tables API
    description: >-
      REST API for tables data (datatables) — row and column filtered access
      to hundreds of financial, economic, and alternative datasets, with JSON,
      XML, and CSV formats, cursor-based pagination, and an asynchronous bulk
      export (qopts.export=true).
    humanURL: https://docs.data.nasdaq.com/docs/api-and-analysis-tools-for-tables-data
    baseURL: https://data.nasdaq.com/api/v3
    tags:
      - Financial Data
      - Tables
      - Market Data
    properties:
      - type: Documentation
        url: https://docs.data.nasdaq.com/docs/api-and-analysis-tools-for-tables-data
      - type: APIReference
        url: https://docs.data.nasdaq.com/docs/in-depth-usage-1
      - type: RateLimits
        url: rate-limits/nasdaq-data-link-rate-limits.yml
      - type: ErrorCatalog
        url: errors/nasdaq-data-link-error-codes.yml
  - name: Nasdaq Data Link REST API for Real-Time or Delayed Data
    description: >-
      REST API (Nasdaq Cloud Data Service) for real-time or delayed exchange
      data — Nasdaq Basic, Last Sale+, BBO, Global Index Data Service, and
      Smart Options — authenticated with client credentials exchanged for a
      bearer token. Base URL is provisioned per customer by Nasdaq sales.
    humanURL: https://docs.data.nasdaq.com/docs/api-for-real-time-or-delayed-data-1
    baseURL: https://data.nasdaq.com/api/v3
    tags:
      - Market Data
      - Real-Time
    properties:
      - type: Documentation
        url: https://docs.data.nasdaq.com/docs/api-for-real-time-or-delayed-data-1
      - type: APIReference
        url: https://github.com/Nasdaq/NasdaqCloudDataService-REST-API
      - type: Postman
        url: https://github.com/Nasdaq/NasdaqCloudDataService-REST-API/tree/main/restapi/postman
  - name: Nasdaq Data Link Streaming API
    description: >-
      Streaming API (Nasdaq Cloud Data Service) for real-time products —
      Nasdaq Basic, Last Sale+, TotalView, Consolidated Quotes and Trades,
      Global Index Data Service, Smart Options, and Benzinga MarketNewswires —
      consumed through official Java and Python SDKs with OAuth client
      credentials (client ID, client secret, token endpoint, bootstrap
      servers).
    humanURL: https://docs.data.nasdaq.com/docs/streaming-api-1
    baseURL: https://data.nasdaq.com/api/v3
    tags:
      - Market Data
      - Streaming
      - Real-Time
    properties:
      - type: Documentation
        url: https://docs.data.nasdaq.com/docs/streaming-api-1
      - type: SDK
        url: https://github.com/Nasdaq/NasdaqCloudDataService-SDK-Java
      - type: SDK
        url: https://github.com/Nasdaq/NasdaqCloudDataService-SDK-Python
