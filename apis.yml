name: Nasdaq Data Link
description: >-
  Nasdaq Data Link (formerly Quandl) is Nasdaq's financial, economic, and
  alternative data platform, offering hundreds of free and premium datasets
  from publishers like Zacks, Sharadar, QuoteMedia, and the World Bank. Data
  is delivered through a REST API for tables data, a REST API for real-time
  or delayed exchange data, and a streaming API (Nasdaq Cloud Data Service),
  with official Python, R, Excel, and CLI tooling.
